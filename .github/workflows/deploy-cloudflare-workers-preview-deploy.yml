name: Cloudflare Workers (Preview) Deploy

on:
  workflow_run:
    workflows:
      - Cloudflare Workers (Preview) Prepare
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  ask-for-approval:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Ask for approval to deploy playground
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - name: Download artifact - metadata
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow_conclusion: success
          run_id: ${{ github.event.workflow_run.id }}
          name: preview-meta
          path: preview-meta
          allow_forks: true

      - name: Parse metadata
        id: meta
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from 'node:fs/promises'

          const metadata = JSON.parse(await readFile('preview-meta/preview-meta.json', 'utf8'))
          if (
            !/^\d+$/.test(metadata.prNumber)
            || !/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(metadata.repositoryFullName)
            || !/^[a-f0-9]{40}$/i.test(metadata.headSha)
          ) {
            throw new Error('Preview metadata has an invalid shape')
          }

          await appendFile(process.env.GITHUB_OUTPUT, `PR_NUM=${metadata.prNumber}\n`)
          NODE

      - name: Find comment
        id: fc
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ steps.meta.outputs.PR_NUM }}
          comment-author: github-actions[bot]
          body-includes: to Cloudflare Workers (Preview) for *playground*

      - name: Comment on required approval
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ steps.meta.outputs.PR_NUM }}
          edit-mode: replace
          body: |
            ## ⏳ Approval required for deploying to Cloudflare Workers (Preview) for *playground*.

            | Name | Link |
            |:-----|:-----|
            | 🔭 Waiting for approval | For maintainers, approve [here](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    needs: ask-for-approval
    name: Deploy playground preview
    runs-on: ubuntu-latest
    environment: Preview
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - name: Download artifact - metadata
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow_conclusion: success
          run_id: ${{ github.event.workflow_run.id }}
          name: preview-meta
          path: preview-meta
          allow_forks: true

      - name: Parse metadata
        id: meta
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from 'node:fs/promises'

          const metadata = JSON.parse(await readFile('preview-meta/preview-meta.json', 'utf8'))
          if (
            !/^\d+$/.test(metadata.prNumber)
            || !/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(metadata.repositoryFullName)
            || !/^[a-f0-9]{40}$/i.test(metadata.headSha)
          ) {
            throw new Error('Preview metadata has an invalid shape')
          }

          await appendFile(process.env.GITHUB_OUTPUT, [
            `PR_NUM=${metadata.prNumber}`,
            `REPO_FULL_NAME=${metadata.repositoryFullName}`,
            `HEAD_SHA=${metadata.headSha}`,
            '',
          ].join('\n'))
          NODE

      - name: Checkout pull request source
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.meta.outputs.REPO_FULL_NAME }}
          ref: ${{ steps.meta.outputs.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
          # The Preview environment approval is the trust boundary before this
          # workflow executes code from a pull request or exposes deploy secrets.
          allow-unsafe-pr-checkout: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      # NOTICE:
      # Wrangler Action installs Wrangler into the workspace when no executable is available.
      # pnpm then rejects workerd's unapproved build script and aborts the deployment.
      # Source: https://github.com/cloudflare/wrangler-action/issues/181#issuecomment-2127990708
      # Remove this after Wrangler Action can install with pnpm without mutating the workspace.
      - name: Install Wrangler
        run: pnpm install --global wrangler@4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build playground
        id: build
        run: pnpm --dir playground build
        continue-on-error: true

      - name: Find comment
        if: ${{ always() }}
        id: fc
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ steps.meta.outputs.PR_NUM }}
          comment-author: github-actions[bot]
          body-includes: to Cloudflare Workers (Preview) for *playground*

      - name: Comment on build failure
        if: ${{ steps.build.outcome != 'success' }}
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ steps.meta.outputs.PR_NUM }}
          edit-mode: replace
          body: |
            ## ❌ Deploy to Cloudflare Workers (Preview) for *playground* failed.

            | Name | Link |
            |:-----|:-----|
            | 🔍 Latest deploy log | https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} |

      - name: Fail if build failed
        if: ${{ steps.build.outcome != 'success' }}
        run: exit 1

      - name: Upload preview version
        if: ${{ steps.build.outcome == 'success' }}
        id: wrangler-version-upload
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: versions upload -c ./playground/wrangler.toml --preview-alias pr-${{ steps.meta.outputs.PR_NUM }} --message "GitHub Actions uploaded preview for Pull Request ${{ steps.meta.outputs.PR_NUM }}" --tag v0.0.1-pr.${{ steps.meta.outputs.PR_NUM }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare preview URLs
        if: ${{ steps.build.outcome == 'success' }}
        id: preview-urls
        env:
          DEPLOYMENT_URL: ${{ steps.wrangler-version-upload.outputs.deployment-url }}
          PR_NUM: ${{ steps.meta.outputs.PR_NUM }}
        run: |
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "Deployment URL from Wrangler upload is empty." >&2
            exit 1
          fi

          host_without_scheme="${DEPLOYMENT_URL#https://}"
          host_without_scheme="${host_without_scheme#http://}"
          preview_alias_url="https://pr-${PR_NUM}-${host_without_scheme#*-}"

          echo "deploy_preview_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "pull_request_preview_url=$preview_alias_url" >> "$GITHUB_OUTPUT"

      - name: Create or update comment
        if: ${{ steps.build.outcome == 'success' }}
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ steps.meta.outputs.PR_NUM }}
          edit-mode: replace
          body: |
            ## ✅ Deploy to Cloudflare Workers (Preview) for *playground* ready!

            | Name | Link |
            |:-----|:-----|
            | 🔍 Latest deploy log | https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} |
            | 😎 Deploy Preview | ${{ steps.preview-urls.outputs.deploy_preview_url }} |
            | 🚀 Pull Request Preview | ${{ steps.preview-urls.outputs.pull_request_preview_url }} |
